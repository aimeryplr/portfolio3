[build]
  command = "pnpm build"
  publish = "dist"

# the contact address is printed in the public CV on purpose: don't fail the build when the scan finds it
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_TO_EMAIL"

[dev]
  command = "pnpm dev"
  publish = "dist"
  framework = "astro"

# the netlify.app addresses serve the same content as the custom domain: send them all to aimerypellerin.fr
[[redirects]]
  from = "https://portfolio-aimery.netlify.app/*"
  to = "https://aimerypellerin.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://master--portfolio-aimery.netlify.app/*"
  to = "https://aimerypellerin.fr/:splat"
  status = 301
  force = true
